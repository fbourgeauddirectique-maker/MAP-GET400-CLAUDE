<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Carto Guidage</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== EN-TÊTE ===== -->
  <header id="app-header">
    <div class="header-row">
      <div class="brand">
        <span class="brand-mark">CG</span>
        <span class="brand-name">Carto Guidage</span>
      </div>
      <div class="header-actions">
        <button id="btn-menu" class="icon-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div id="status-bar" class="status-bar">
      <span id="status-text">Aucune tournée chargée</span>
    </div>
  </header>

  <!-- ===== PANNEAU LATÉRAL / MENU ===== -->
  <div id="side-panel" class="side-panel">
    <div class="side-panel-inner">
      <h2>Tournée</h2>

      <section class="panel-section">
        <h3>1. Importer les points</h3>
        <label class="file-input-label" for="excel-input">
          Choisir un fichier Excel (.xlsx / .xls)
        </label>
        <input type="file" id="excel-input" accept=".xlsx,.xls" hidden>
        <div id="import-summary" class="import-summary"></div>
      </section>

      <section class="panel-section" id="column-mapping" hidden>
        <h3>2. Colonnes à utiliser</h3>
        <label class="field-label">Colonne — Nom du point
          <select id="col-name"></select>
        </label>
        <label class="field-label">Colonne — Latitude
          <select id="col-lat"></select>
        </label>
        <label class="field-label">Colonne — Longitude
          <select id="col-lng"></select>
        </label>
        <button id="btn-apply-mapping" class="btn-primary">Valider l'import</button>
      </section>

      <section class="panel-section">
        <h3>3. Zones réglementaires</h3>
        <div class="zone-toggle-list">
          <label class="zone-toggle">
            <input type="checkbox" id="zone-toggle-ztd" data-zone="ztd">
            <span class="zone-swatch zone-swatch-ztd"></span>
            ZTD
          </label>
          <label class="zone-toggle">
            <input type="checkbox" id="zone-toggle-azd" data-zone="azd">
            <span class="zone-swatch zone-swatch-azd"></span>
            AZD
          </label>
          <label class="zone-toggle">
            <input type="checkbox" id="zone-toggle-znd" data-zone="znd">
            <span class="zone-swatch zone-swatch-znd"></span>
            ZND
          </label>
        </div>
        <div id="zones-status" class="field-hint"></div>
      </section>

      <section class="panel-section">
        <h3>4. Paramètres trajet</h3>
        <div class="field-row">
          <label class="field-label">Min (min)
            <input type="number" id="dur-min" value="15" min="1">
          </label>
          <label class="field-label">Max (min)
            <input type="number" id="dur-max" value="20" min="1">
          </label>
        </div>
        <label class="field-label">Clé API Google Directions
          <input type="password" id="google-api-key" placeholder="Votre clé API">
        </label>
        <div class="field-hint">La clé reste uniquement sur cet appareil (stockage local).</div>
      </section>

      <section class="panel-section">
        <h3>5. Sauvegarde</h3>
        <div class="btn-group">
          <button id="btn-export" class="btn-secondary">Exporter (JSON)</button>
          <label class="btn-secondary file-input-label" for="json-input">Importer (JSON)</label>
          <input type="file" id="json-input" accept="application/json" hidden>
        </div>
        <div class="field-hint">Sauvegarde automatique activée sur cet appareil.</div>
        <button id="btn-reset" class="btn-danger">Réinitialiser la tournée</button>
      </section>
    </div>
    <button id="btn-close-panel" class="btn-close-panel" aria-label="Fermer le menu">&times;</button>
  </div>
  <div id="panel-backdrop" class="panel-backdrop" hidden></div>

  <!-- ===== LISTE DES POINTS (tiroir bas) ===== -->
  <div id="points-drawer" class="points-drawer">
    <button id="drawer-handle" class="drawer-handle" aria-label="Afficher/masquer la liste des points">
      <span class="drawer-grip"></span>
      <span id="drawer-title">Points de la tournée (0)</span>
    </button>
    <div id="points-list" class="points-list"></div>
  </div>

  <!-- ===== CARTE ===== -->
  <main id="map"></main>
  <div id="map-legend" class="map-legend" hidden></div>

  <!-- ===== FICHE POINT (modale bas d'écran) ===== -->
  <div id="point-sheet" class="point-sheet" hidden>
    <div class="point-sheet-inner">
      <div class="point-sheet-header">
        <div>
          <div class="point-sheet-eyebrow" id="sheet-pair-label">Paire</div>
          <h3 id="sheet-point-name">Nom du point</h3>
        </div>
        <button id="sheet-close" class="icon-btn" aria-label="Fermer">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div id="sheet-route-info" class="route-info"></div>

      <div class="point-sheet-actions">
        <button id="sheet-navigate" class="btn-primary btn-full">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2L4 21l8-4 8 4L12 2z" fill="currentColor"/></svg>
          Lancer le guidage
        </button>
        <button id="sheet-toggle-status" class="btn-status btn-full">Marquer comme validé</button>
      </div>
    </div>
  </div>

  <!-- ===== TOAST NOTIFICATIONS ===== -->
  <div id="toast" class="toast" hidden></div>

  <!-- ===== LIBS ===== -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
